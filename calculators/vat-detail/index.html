  </head>
  <body class="calc-page" data-calculator="vat-detail">
    <div class="page-shell">
      <nav class="topbar">
        <a class="brand" href="../../">생활 속 계산기</a>
        <div class="topbar-actions">
          <div class="topbar-links">
            <a href="../../">홈</a>
            <a href="../vat/">기본 부가세 계산기</a>
            <a href="../../notices/">공지사항</a>
            <a href="../estimate/">견적</a>
          </div>
          <button class="ghost-btn theme-toggle" id="themeToggle" type="button">다크 모드</button>
        </div>
      </nav>
      <header class="calc-hero section salary-hero">
        <div class="crumbs"><a href="../../">홈</a> / <a href="../vat/">부가세 계산기</a> / 부가세 상세 계산</div>
        <p class="eyebrow">사업 계산기</p>
        <h1>부가세 상세 계산</h1>
        <p class="article-lead">수량, 세율, 추가 비용을 반영해 거래 단위로 공급가와 부가세, 총액을 자세히 계산할 수 있습니다.</p>
        <div class="hero-actions">
          <a class="ghost-btn" href="../vat/">기본 계산기로 돌아가기</a>
          <button class="ghost-btn" id="shareButton" type="button">링크 복사</button>
        </div>
      </header>
      <main class="section article-grid">
        <article class="article-card">
          <h2>상세 입력으로 계산</h2>
          <form class="form-grid">
            <label>계산 기준<select id="vatDetailMode"><option value="supply">공급가액 기준</option><option value="total">총 금액 기준</option></select></label>
            <label>기준 금액<input type="number" id="vatDetailAmount" min="0" max="1000000000" step="1" value="100000" /></label>
            <label>수량<input type="number" id="vatDetailQuantity" min="1" max="1000000" step="1" value="3" /></label>
            <label>부가세율(%)<input type="number" id="vatDetailRate" min="0" max="100" step="0.1" value="10" /></label>
            <label>추가 비용<input type="number" id="vatDetailExtra" min="0" max="1000000000" step="1" value="5000" /></label>
          </form>
          <div class="premium-payslip" id="vatDetailResult"></div>
        </article>
        <aside class="sidebar-stack">
          <div class="mini-card">
            <p class="mini-label">같이 보기</p>
            <div class="related-grid">
              <a class="related-card" href="../estimate/"><strong>견적 계산기</strong><p>수량과 할인까지 반영한 견적 금액을 계산합니다.</p></a>
              <a class="related-card" href="../settlement/"><strong>정산 계산기</strong><p>비용과 수수료를 제외한 정산액을 계산합니다.</p></a>
            </div>
          </div>
        </aside>
      </main>
    </div>
